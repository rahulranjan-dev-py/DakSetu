name: Deploy to GitHub Pages

# Publishes the production build to the `gh-pages` branch. GitHub serves that
# branch at https://<owner>.github.io/<repo>/ (Pages is enabled automatically
# for public repositories when the branch first appears; otherwise pick
# "gh-pages" as the source under Settings → Pages once).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the Pages sub-path
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
